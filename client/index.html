<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1f2616" />
    <title>Hillsedge Beragala — Mountain Smokehouse &amp; Dining Experience</title>
    <meta
      name="description"
      content="A mountain smokehouse and dining destination in Beragala, Sri Lanka. Slow smoke, handcrafted flavour and hill-country views, 1,000m above the sea."
    />
    <meta name="color-scheme" content="light" />
    <meta property="og:title" content="Hillsedge Beragala — Mountain Smokehouse &amp; Dining" />
    <meta
      property="og:description"
      content="Slow smoke, mountain air. A smokehouse dining destination in Sri Lanka's hill country."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Loaded without blocking the first paint. A plain `rel="stylesheet"` here
      holds the render tree hostage: when fonts.googleapis.com is slow or
      unreachable the page stays blank until the request times out — measured
      at over 12s against a hanging host, versus 28ms without it.

      `media="print"` keeps the sheet out of the render path while the preload
      above fetches it at high priority; src/main.jsx flips it to `all` on
      startup. The swap lives in the bundle rather than an inline `onload`
      handler so that script-src in the Content-Security-Policy can stay
      'self' with no 'unsafe-inline'.
    -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Manrope:wght@400;500;600&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Manrope:wght@400;500;600&display=swap"
      media="print"
      data-webfont
    />
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: grid;
        place-items: center;
        background: #faf8f3;
        color: #1f2616;
        transition:
          opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1),
          transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        animation: splash-auto-out 0.6s ease 4s forwards;
      }
      #splash.is-leaving {
        opacity: 0;
        transform: scale(1.02);
        pointer-events: none;
      }
      .splash-inner {
        display: grid;
        justify-items: center;
        gap: 4px;
      }
      .splash-mark {
        width: 56px;
        height: 64px;
        margin-bottom: 14px;
        stroke: #a7843f;
        stroke-width: 2;
        stroke-linecap: round;
      }
      .splash-arch,
      .splash-h {
        stroke-dasharray: 160;
        stroke-dashoffset: 160;
        animation: splash-draw 1.1s cubic-bezier(0.65, 0, 0.35, 1) forwards;
      }
      .splash-h {
        stroke: #4a5a32;
        animation-delay: 0.25s;
      }
      .splash-word {
        margin: 0;
        font:
          600 30px/1 'Cormorant Garamond',
          Georgia,
          serif;
        letter-spacing: 0.02em;
        opacity: 0;
        animation: splash-rise 0.8s 0.35s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      .splash-place {
        margin: 0;
        font:
          600 10px/1.8 'Manrope',
          system-ui,
          sans-serif;
        letter-spacing: 0.5em;
        text-transform: uppercase;
        color: #8a6a2c;
        opacity: 0;
        animation: splash-rise 0.8s 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      .splash-bar {
        position: relative;
        width: 120px;
        height: 1px;
        margin-top: 22px;
        background: rgba(31, 38, 22, 0.12);
        overflow: hidden;
      }
      .splash-bar span {
        position: absolute;
        inset: 0;
        background: #c3a25e;
        transform: translateX(-100%);
        animation: splash-load 1.2s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      @keyframes splash-draw {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes splash-rise {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes splash-load {
        to {
          transform: translateX(100%);
        }
      }
      @keyframes splash-auto-out {
        to {
          opacity: 0;
          visibility: hidden;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash {
          display: none;
        }
      }
    </style>
    <noscript>
      <style>
        #splash {
          display: none;
        }
      </style>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Manrope:wght@400;500;600&display=swap"
      />
    </noscript>
  </head>
  <body>
    <!--
      The splash paints with the HTML, before any JavaScript. It is static
      markup and CSS because script-src in the Content-Security-Policy is
      'self' with no 'unsafe-inline'. src/components/Splash.jsx fades it out
      once React has mounted; if the app never loads, the CSS fades it out by
      itself after a few seconds, so it can never hide the page for good.
    -->
    <div id="splash" aria-hidden="true">
      <div class="splash-inner">
        <svg class="splash-mark" viewBox="0 0 64 72" fill="none">
          <path class="splash-arch" d="M8 70V30a24 24 0 0 1 48 0v40" />
          <path class="splash-h" d="M22 62V30M42 62V30M22 46h20" />
        </svg>
        <p class="splash-word">Hillsedge</p>
        <p class="splash-place">Beragala</p>
        <span class="splash-bar"><span></span></span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
